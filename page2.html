<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>BRUGERID & MITID</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 50px;
        }
        .auth-logo {
            width: 150px;
            height: auto;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="https://www.virk.dk/-/media/project/brandguide/logos/virk-logo.svg" 
                 alt="Virk Logo" 
                 class="virk-logo">
        </div>
    </header>
    <main>
        <h1>Log ind med BRUGERID eller MITID</h1>
        <div class="auth-container">
            <img src="https://www.brugerid.gov.dk/-/media/project/brandguide/logos/brugerid-logo.svg" 
                 alt="BRUGERID Logo" 
                 class="auth-logo">
            <img src="https://www.mitid.dk/-/media/project/brandguide/logos/mitid-logo.svg" 
                 alt="MITID Logo" 
                 class="auth-logo">
        </div>
    </main>
</body>
</html>
